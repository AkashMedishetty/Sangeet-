<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Exchange — Shreyasi &amp; Prithvi's Sangeet</title>
  <meta name="description" content="LED wall preview for The Exchange — a Choreo &amp; Cue sangeet concept." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=Cinzel:wght@600;700&display=swap" />
  <style>
    :root { --ink: #060606; --gold: #c9a227; --gold-hi: #ecc966; --paper: #f4ecd6; --muted: rgba(244,236,214,0.55); --line: rgba(244,236,214,0.1);
      --red: #e0384a; --green: #34c063; --ease: cubic-bezier(0.16, 1, 0.3, 1); }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--ink); color: var(--paper); font-family: "Barlow", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 18px 16px 24px; gap: 16px; }
    button { font: inherit; color: inherit; cursor: pointer; }
    button:focus-visible, a:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }

    header { width: 100%; max-width: 1400px; display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .brand { font-family: "Cinzel", serif; font-weight: 700; font-size: 22px; letter-spacing: 0.06em; color: var(--gold-hi); }
    .brand small { display: block; font-family: "Barlow Condensed", sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 0.32em; color: var(--muted); margin-top: 2px; }
    .links { display: flex; gap: 18px; font-family: "Barlow Condensed", sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 0.14em; }
    .links a { color: var(--muted); text-decoration: none; } .links a:hover { color: var(--gold-hi); }

    .screen { width: 100%; max-width: min(1400px, calc((100vh - 250px) * 16 / 9)); min-width: min(100%, 320px); }
    .frame { position: relative; aspect-ratio: 16 / 9; border-radius: 6px; overflow: hidden; background: #000;
      box-shadow: 0 0 0 1px rgba(201,162,39,0.35), 0 24px 80px rgba(0,0,0,0.8); }
    .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; }
    .now { display: flex; justify-content: space-between; margin-top: 10px; font-family: "Barlow Condensed", sans-serif; font-weight: 600;
      font-size: 14px; letter-spacing: 0.16em; color: var(--muted); gap: 12px; flex-wrap: wrap; }
    .now b { color: var(--gold-hi); font-weight: 600; }

    .deck { width: 100%; max-width: 1400px; display: flex; flex-direction: column; gap: 10px; }
    .play { align-self: center; padding: 12px 26px; border-radius: 999px; border: 1px solid var(--gold);
      background: linear-gradient(180deg, #3a2d0e, #1f1807); color: var(--gold-hi); font-family: "Barlow Condensed", sans-serif;
      font-weight: 700; font-size: 16px; letter-spacing: 0.18em; transition: box-shadow .2s; }
    .play:hover { box-shadow: 0 0 26px rgba(201,162,39,0.3); }
    .play.on { background: #1a1712; color: var(--paper); border-color: var(--line); }
    .steps { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 10px; scroll-snap-type: x proximity; }
    .grp { flex: none; display: flex; flex-direction: column; gap: 6px; scroll-snap-align: start; }
    .grp h3 { margin: 0 2px; font-family: "Barlow Condensed", sans-serif; font-weight: 600; font-size: 11px; letter-spacing: 0.26em; color: rgba(244,236,214,0.35); white-space: nowrap; }
    .grp div { display: flex; gap: 6px; }
    .st { white-space: nowrap; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line); background: #121110;
      font-weight: 600; font-size: 14px; transition: border-color .15s, background .15s, transform .08s; }
    .st:hover { border-color: rgba(201,162,39,0.5); background: #1b1915; }
    .st:active { transform: scale(0.97); }
    .st.live { border-color: var(--gold-hi); background: rgba(201,162,39,0.14); color: var(--gold-hi); }
    .st.g { color: #ff98a3; } .st.b { color: #8cf0b0; }
    .st.call.g { background: linear-gradient(180deg, #4a121b, #2a080e); border-color: rgba(224,56,74,0.5); }
    .st.call.b { background: linear-gradient(180deg, #123d20, #0a2412); border-color: rgba(52,192,99,0.5); }
    .st:disabled { opacity: 0.35; cursor: not-allowed; }
    footer { font-size: 12px; color: rgba(244,236,214,0.3); letter-spacing: 0.08em; }
  </style>
</head>
<body>
  <header>
    <div class="brand">THE EXCHANGE<small id="couple">LED WALL PREVIEW</small></div>
    <nav class="links"><a href="output.html" target="exchange_wall">FULL-SCREEN WALL ↗</a><a href="control.html">OPERATOR CONSOLE</a></nav>
  </header>

  <section class="screen">
    <div class="frame"><iframe src="output.html?preview=1" title="LED wall"></iframe></div>
    <div class="now"><span>ON SCREEN · <b id="now">HOME LOOK</b></span><span id="score"></span></div>
  </section>

  <section class="deck">
    <button class="play" id="play">▶ PLAY FULL SHOW</button>
    <div class="steps" id="steps"></div>
  </section>

  <footer>Concept by Choreo &amp; Cue</footer>

  <script src="js/state.js"></script>
  <script src="js/client.js"></script>
</body>
</html>
